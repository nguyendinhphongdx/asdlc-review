<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>try{var u=new URLSearchParams(location.search),q=u.get("theme");if(u.has("still"))document.documentElement.classList.add("still");if(q)localStorage.setItem("theme",q);if(localStorage.getItem("theme")==="dark"||(!localStorage.getItem("theme")&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch{}</script>
