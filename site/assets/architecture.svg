<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Inter,'Segoe UI',system-ui,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker></defs>
  <rect width="1100" height="640" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">Micro-module architecture</text>
  <text x="32" y="66" font-size="13" fill="#64748b">Module không import module khác · chỉ app/ (composition root) nối module qua public API và Port/Adapter</text>

  <!-- clients -->
  <rect x="32" y="90" width="1036" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="50" y="114" font-size="12" fill="#64748b" letter-spacing="1">CLIENTS</text>
  <g font-size="13" font-weight="600" fill="#0f172a">
    <rect x="50" y="122" width="150" height="20" rx="6" fill="#eef2ff"/><text x="62" y="137">Web (React)</text>
    <rect x="212" y="122" width="150" height="20" rx="6" fill="#eef2ff"/><text x="224" y="137">Electron shell</text>
    <rect x="374" y="122" width="170" height="20" rx="6" fill="#eef2ff"/><text x="386" y="137">GitLab / GitHub hook</text>
    <rect x="556" y="122" width="150" height="20" rx="6" fill="#eef2ff"/><text x="568" y="137">Chat command</text>
  </g>
  <path d="M550 148v26" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- app -->
  <rect x="32" y="178" width="1036" height="130" rx="14" fill="#312e81"/>
  <text x="50" y="204" font-size="12" fill="#c7d2fe" letter-spacing="1">app/  —  COMPOSITION ROOT (chỉ nơi này được import module)</text>
  <g font-size="13" font-weight="600">
    <rect x="50" y="218" width="230" height="70" rx="10" fill="#4338ca"/><text x="64" y="244" fill="#fff">http/ · Fastify routes</text><text x="64" y="264" font-size="11.5" fill="#c7d2fe" font-weight="400">webhook, REST, SPA</text>
    <rect x="296" y="218" width="380" height="70" rx="10" fill="#4338ca"/><text x="310" y="244" fill="#fff">workflows/ · review-merge-request …</text><text x="310" y="264" font-size="11.5" fill="#c7d2fe" font-weight="400">điều phối nhiều module theo thứ tự</text>
    <rect x="692" y="218" width="376" height="70" rx="10" fill="#4338ca"/><text x="706" y="244" fill="#fff">adapters/ · Port ↔ module API</text><text x="706" y="264" font-size="11.5" fill="#c7d2fe" font-weight="400">analytics ← reviews.facts, identity</text>
  </g>
  <path d="M550 308v28" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- modules -->
  <rect x="32" y="340" width="1036" height="196" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="50" y="364" font-size="12" fill="#64748b" letter-spacing="1">modules/  —  14 MODULE ĐỘC LẬP · index.ts là cổng công khai duy nhất</text>
  <g font-size="12.5" font-weight="600" fill="#1e1b4b">
    <g fill="#eef2ff" stroke="#c7d2fe">
      <rect x="50" y="378" width="118" height="40" rx="8"/><rect x="178" y="378" width="118" height="40" rx="8"/><rect x="306" y="378" width="118" height="40" rx="8"/><rect x="434" y="378" width="118" height="40" rx="8"/><rect x="562" y="378" width="118" height="40" rx="8"/><rect x="690" y="378" width="118" height="40" rx="8"/><rect x="818" y="378" width="118" height="40" rx="8"/>
      <rect x="50" y="428" width="118" height="40" rx="8"/><rect x="178" y="428" width="118" height="40" rx="8"/><rect x="306" y="428" width="118" height="40" rx="8"/><rect x="434" y="428" width="118" height="40" rx="8"/><rect x="562" y="428" width="118" height="40" rx="8"/><rect x="690" y="428" width="118" height="40" rx="8"/><rect x="818" y="428" width="118" height="40" rx="8"/>
    </g>
    <text x="109" y="403" text-anchor="middle">scm</text><text x="237" y="403" text-anchor="middle">workspace</text><text x="365" y="403" text-anchor="middle">harness</text><text x="493" y="403" text-anchor="middle">framework</text><text x="621" y="403" text-anchor="middle">analysis</text><text x="749" y="403" text-anchor="middle">reviewer</text><text x="877" y="403" text-anchor="middle">scoring</text>
    <text x="109" y="453" text-anchor="middle">publisher</text><text x="237" y="453" text-anchor="middle">queue</text><text x="365" y="453" text-anchor="middle">reviews</text><text x="493" y="453" text-anchor="middle">analytics</text><text x="621" y="453" text-anchor="middle">identity</text><text x="749" y="453" text-anchor="middle">repos</text><text x="877" y="453" text-anchor="middle">settings</text>
  </g>
  <rect x="954" y="378" width="96" height="90" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1002" y="416" text-anchor="middle" font-size="22" fill="#dc2626">✕</text><text x="1002" y="440" text-anchor="middle" font-size="11" fill="#991b1b">không import</text><text x="1002" y="455" text-anchor="middle" font-size="11" fill="#991b1b">chéo nhau</text>
  <text x="50" y="500" font-size="12" fill="#64748b">Mỗi module: domain/ (thuần) · application/ · infra/ (I/O) · MODULE.md · sở hữu bảng dữ liệu riêng (chỉ lưu ID chuỗi)</text>
  <text x="50" y="520" font-size="12" fill="#64748b">Kiểm bằng máy: pnpm arch (R1–R18, M3, M7, M10–M12)</text>
  <path d="M550 536v26" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- kernel/data -->
  <rect x="32" y="566" width="1036" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="13" font-weight="600" fill="#0f172a">
    <text x="50" y="599">kernel/</text><text x="110" y="599" font-weight="400" fill="#64748b">logger · errors · event-bus · exec · db · clock · http</text>
    <text x="640" y="599">packages/contracts</text><text x="790" y="599" font-weight="400" fill="#64748b">DTO + zod dùng chung</text>
    <text x="940" y="599">SQLite</text>
  </g>
</svg>
