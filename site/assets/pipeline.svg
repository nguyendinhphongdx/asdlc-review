      <rect x="498" y="176" width="170" height="52" rx="10"/><rect x="684" y="176" width="170" height="52" rx="10"/><rect x="870" y="176" width="182" height="52" rx="10"/>
      <rect x="498" y="248" width="170" height="52" rx="10"/><rect x="684" y="248" width="170" height="52" rx="10"/>
