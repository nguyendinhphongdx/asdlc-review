  </defs>
  <rect width="1100" height="420" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">Review pipeline</text>
  <!-- triggers -->
  <g font-size="14" fill="#0f172a">
