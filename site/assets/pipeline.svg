  <text x="365" y="192" text-anchor="middle" font-size="12" fill="#e0e7ff">BullMQ / memory</text>
  <text x="365" y="210" text-anchor="middle" font-size="11" fill="#c7d2fe">dedupe mr:headSha</text>
  <path d="M430 180h44" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- steps -->
  <g font-size="13">
    <rect x="480" y="64" width="590" height="296" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="498" y="90" font-size="12" fill="#64748b" letter-spacing="1">WORKER</text>
