name: Release
# Tạo release: git tag v0.1.0 && git push origin v0.1.0
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Đóng gói
        run: |
          NAME="asdlc-review-${GITHUB_REF_NAME}"
          mkdir -p "dist-release/$NAME"
          git archive HEAD | tar -x -C "dist-release/$NAME"
          mkdir -p "dist-release/$NAME/apps/web"
          cp -r apps/web/dist "dist-release/$NAME/apps/web/dist"
          tar -C dist-release -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Tạo GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "ASDLC Review $GITHUB_REF_NAME" \
            "asdlc-review-${GITHUB_REF_NAME}.tar.gz" "asdlc-review-${GITHUB_REF_NAME}.tar.gz.sha256"
