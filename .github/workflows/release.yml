name: Release
# Tạo release: git tag v0.3.0 && git push origin v0.3.0
# Job "release" tạo release + gói mã nguồn; job "desktop" build app macOS (arm64, Intel) và Windows rồi đính kèm vào release.
on:
  push: { tags: ["v*"] }
  workflow_call:
    inputs:
      tag: { type: string, required: true }
permissions: { contents: write }
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref_name }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Đóng gói
        run: |
          NAME="asdlc-review-${TAG}"
          mkdir -p "dist-release/$NAME"
          git archive HEAD | tar -x -C "dist-release/$NAME"
          mkdir -p "dist-release/$NAME/apps/web"
          cp -r apps/web/dist "dist-release/$NAME/apps/web/dist"
          tar -C dist-release -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Tạo GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$TAG" --generate-notes --title "ASDLC Review $TAG" \
            "asdlc-review-${TAG}.tar.gz" "asdlc-review-${TAG}.tar.gz.sha256"

  # Bản cài đặt app desktop: build trên từng OS để native module (Prisma engine) đúng nền tảng.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: "macOS (Apple Silicon)" }
          - { os: macos-15-intel, name: "macOS (Intel)" }
          - { os: windows-latest, name: "Windows" }
    runs-on: ${{ matrix.os }}
    name: desktop · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref_name }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:desktop
      - name: Tải lên release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" out/ASDLC-Review-*.zip out/ASDLC-Review-*.zip.sha256 --clobber
